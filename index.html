<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#6657d9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VokabelMonster"><link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./layout-patch.css"><title>VokabelMonster</title></head><body><header><h1>👾 VokabelMonster</h1><div class="head"><span>🪙 <b id="headCoins">0</b></span><button id="settings">⚙️</button></div></header><main>
<section id="learn" class="page active"><h2>Lernen</h2><div class="card"><label>Sets zum Lernen<select id="learnSets" multiple></select></label><div class="quickdir"><b>Lernrichtung</b><div><button data-dir="de-en">Deutsch → Englisch</button><button data-dir="en-de">Englisch → Deutsch</button><button data-dir="random">🎲 Zufällig</button></div></div><button id="start" class="primary">▶ Lernrunde starten</button><button id="startHard">🔥 Nur schwierige</button></div><div id="quiz" class="card" hidden><div class="bar"><i id="roundBar"></i></div><div class="quiztop"><small id="direction"></small><button id="changeDir">↔ Richtung</button></div><h2 id="question"></h2><input id="answer" placeholder="Antwort eingeben"><div class="grid"><button id="check" class="primary">Prüfen</button><button id="unknown">🤷 Weiß ich nicht</button></div><p id="feedback"></p><p id="example"></p><div id="rate" hidden><button data-rate="hard">😕 Schwierig</button><button data-rate="ok">🙂 Geht so</button><button data-rate="easy">⭐ Kann ich</button></div><button id="next" class="primary" hidden>Weiter</button></div><div id="summary" class="card" hidden></div></section>
<section id="sets" class="page"><h2>Sets</h2><div class="card"><input id="setName" placeholder="z. B. Unit 5"><button id="addSet" class="primary">＋ Set anlegen</button></div><div id="setList"></div></section>
<section id="words" class="page"><h2>Vokabeln</h2><div class="card"><label>Set<select id="wordSet"></select></label><input id="en" placeholder="Englisch"><input id="de" placeholder="Deutsch"><input id="ex" placeholder="Beispielsatz (optional)"><input id="edit" type="hidden"><button id="saveWord" class="primary">Vokabel speichern</button></div><div class="card"><h3>CSV-Import</h3><p class="hint">Englisch · Deutsch · Set · Beispielsatz (optional)</p><input id="csv" type="file" accept=".csv,.txt,text/csv"><button id="import">Datei ansehen</button><button id="export">CSV exportieren</button></div><div id="bulk"><button id="all">☑ Alle</button><button id="none">Auswahl aufheben</button><button id="delSelected" class="danger" disabled>🗑 Ausgewählte löschen <span id="selCount"></span></button></div><div id="wordList"></div></section>
<section id="stats" class="page"><h2>Lernstand</h2><div id="statsBox"></div></section>
<section id="monster" class="page"><h2>Monster & Coins</h2><div class="card center"><div id="avatar"></div><h3 id="stage"></h3><div class="bar"><i id="monsterBar"></i></div><p id="monsterGoal" class="hint"></p><p class="coinTotal">🪙 <b id="coins">0</b> Coins</p></div><div id="familyCard" class="card"><h3>👾 Monsterfamilie</h3><div id="family"></div></div><div class="card"><h3>🛍️ Coin-Shop</h3><div id="nextReward"></div><div id="shop"></div></div></section></main>
<nav><button data-page="learn">🎓<span>Lernen</span></button><button data-page="sets">📚<span>Sets</span></button><button data-page="words">✏️<span>Vokabeln</span></button><button data-page="stats">📊<span>Lernstand</span></button><button data-page="monster">👾<span>Monster</span></button></nav><dialog id="dialog"><button id="close">✕</button><div id="dialogBody"></div></dialog><footer>VokabelMonster v1.0.10</footer><script src="./app.js"></script><script src="./layout-patch.js"></script></body></html>
